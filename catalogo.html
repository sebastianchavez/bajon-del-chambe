<!DOCTYPE html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo | El Bajón del Chambe</title>
    <meta
      name="description"
      content="Menú completo de El Bajón del Chambe: hamburguesas, completos, papas fritas, chorrillanas y café. Pide por WhatsApp en un clic."
    />
    <meta name="theme-color" content="#0b0b0d" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Catálogo | El Bajón del Chambe" />
    <meta
      property="og:description"
      content="Hamburguesas, completos, papas, chorrillanas y café. Pide por WhatsApp."
    />
    <meta property="og:image" content="assets/img/og-cover.jpg" />

    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <link rel="apple-touch-icon" href="assets/img/favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="dist/styles.css" />
  </head>

  <body class="bg-ink-950 antialiased">
    <!-- Header -->
    <header
      id="header"
      class="sticky top-0 z-40 border-b border-ink-800 bg-ink-950/90 backdrop-blur-md"
    ></header>

    <main>
      <!-- ================================================================
           PORTADA
           ================================================================ -->
      <section class="relative overflow-hidden border-b border-ink-800">
        <div class="hero-glow absolute inset-0"></div>
        <div class="bg-grid-dark absolute inset-0 opacity-50"></div>

        <div
          class="relative mx-auto max-w-7xl px-4 py-16 text-center sm:px-6 sm:py-20 lg:px-8"
        >
          <p
            class="text-xs font-bold uppercase tracking-widest text-brand-500"
          >
            El menú
          </p>
          <h1
            class="mt-3 font-display text-5xl uppercase text-white sm:text-6xl"
          >
            Catálogo
          </h1>
          <div class="divider-flame mx-auto mt-5"></div>
          <p class="mx-auto mt-6 max-w-xl text-lg text-zinc-400">
            Todo hecho al momento. Elige tu producto y pide por WhatsApp con
            un solo clic.
          </p>
          <p
            id="contador-productos" role="status" aria-live="polite" aria-atomic="true"
            class="mt-4 text-sm font-semibold uppercase tracking-wider text-zinc-500"
          >
            cargando...
          </p>
        </div>
      </section>

      <!-- ================================================================
           FILTROS + GRID
           ================================================================ -->
      <section class="py-10 sm:py-14">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <!-- Tabs de categoría -->
          <div
            id="tabs-categoria"
            class="flex gap-3 overflow-x-auto pb-4 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
            aria-label="Filtrar por categoría"
          >
            <!-- Se rellena desde main.js -->
          </div>

          <!-- Productos -->
          <div id="grid-productos" class="mt-8"></div>
        </div>
      </section>

      <!-- ================================================================
           CTA
           ================================================================ -->
      <section class="border-t border-ink-800 bg-ink-900/40 py-16 sm:py-20">
        <div class="mx-auto max-w-3xl px-4 text-center sm:px-6 lg:px-8">
          <h2 class="font-display text-3xl uppercase text-white sm:text-4xl">
            ¿No ves lo que buscas?
          </h2>
          <p class="mx-auto mt-4 max-w-xl text-zinc-400">
            Escríbenos y armamos el pedido a tu medida. También podemos
            agregarte combos o alternativas.
          </p>
          <a
            href="#"
            data-wa-general
            target="_blank"
            rel="noopener noreferrer"
            class="btn-whatsapp mt-8"
          >
            <span class="h-5 w-5" data-icon="whatsapp"></span>
            Consultar por WhatsApp
          </a>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer id="footer" class="border-t border-ink-800 bg-ink-950"></footer>

    <!-- WhatsApp flotante -->
    <div id="whatsapp-flotante"></div>

    <script type="module" src="src/js/main.js"></script>
    <script type="module" src="src/js/icons.js"></script>
  </body>
</html>
